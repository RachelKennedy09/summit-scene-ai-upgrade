<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1000 1000">
  <title>Summit Scene — Three Sisters badge concept</title>
  <desc>Flat mountain badge based on the supplied Three Sisters photograph: stepped left summit, broad middle tower and pointed right summit with a long ridge. Rounded custom path lettering and a transparent outer background.</desc>
  <defs>
    <clipPath id="badge-clip"><circle cx="500" cy="505" r="311"/></clipPath>
    <!-- Each letter starts as one simple brush stroke. No installed font needed. -->
    <path id="s" d="M 30,-39 C 7,-59 -35,-48 -33,-20 C -30,5 32,-4 33,24 C 35,51 -6,62 -32,40"/>
    <path id="u" d="M -33,-47 L -33,15 Q -33,51 0,51 Q 33,51 33,15 L 33,-47"/>
    <path id="m" d="M -36,48 L -36,-46 Q -36,-54 -29,-39 L 0,4 L 29,-39 Q 36,-54 36,-46 L 36,48"/>
    <path id="i" d="M 0,-49 L 0,49"/>
    <path id="t" d="M -35,-47 L 35,-47 M 0,-47 L 0,49"/>
    <path id="c" d="M 31,-39 C -47,-77 -52,77 31,39"/>
    <path id="e" d="M 30,-47 L -31,-47 L -31,47 L 30,47 M -31,0 L 20,0"/>
    <path id="n" d="M -33,48 L -33,-48 L 33,48 L 33,-48"/>
    <g id="summit" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use xlink:href="#s" transform="translate(215 260) rotate(-35)"/>
      <use xlink:href="#u" transform="translate(315 203) rotate(-21)"/>
      <use xlink:href="#m" transform="translate(435 173) rotate(-7)"/>
      <use xlink:href="#m" transform="translate(565 173) rotate(7)"/>
      <use xlink:href="#i" transform="translate(675 204) rotate(21)"/>
      <use xlink:href="#t" transform="translate(775 261) rotate(35)"/>
    </g>
    <g id="scene" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use xlink:href="#s" transform="translate(270 782) rotate(25)"/>
      <use xlink:href="#c" transform="translate(380 823) rotate(12)"/>
      <use xlink:href="#e" transform="translate(500 838)"/>
      <use xlink:href="#n" transform="translate(620 823) rotate(-12)"/>
      <use xlink:href="#e" transform="translate(730 782) rotate(-25)"/>
    </g>
    <path id="pine" d="M 0,-74 L -24,-34 L -12,-34 L -35,5 L -20,5 L -46,47 L -8,47 L -8,68 L 8,68 L 8,47 L 46,47 L 20,5 L 35,5 L 12,-34 L 24,-34 Z"/>
  </defs>

  <g id="badge">
    <circle cx="500" cy="505" r="321" fill="#173f31"/>
    <circle cx="500" cy="505" r="308" fill="#f6ebd4"/>
    <g clip-path="url(#badge-clip)">
      <g id="sun" fill="#dc9a4c"><circle cx="672" cy="367" r="66"/></g>
      <g id="mountain-silhouette" fill="#82967a" stroke="#173f31" stroke-width="8" stroke-linejoin="round">
        <path d="M 145,535 L 210,478 L 242,466 L 258,416 L 266,380 L 285,385 L 293,375 L 313,374 L 335,362 L 351,360 L 363,375 L 374,407 L 389,419 L 396,438 L 415,444 L 433,461 L 446,421 L 458,385 Q 471,373 483,371 Q 494,371 505,385 L 520,391 L 534,411 L 540,432 L 561,435 L 580,433 L 601,422 L 617,411 L 629,390 L 638,374 L 646,377 L 657,398 L 667,411 L 686,424 L 704,445 L 728,459 L 756,477 L 855,523 L 855,740 L 145,740 Z"/>
      </g>
      <g id="mountain-shadow" fill="#173f31">
        <path d="M 285,385 L 298,434 L 322,441 L 337,494 L 376,507 L 397,561 L 457,612 L 433,461 L 415,444 L 396,438 L 389,419 L 374,407 L 363,375 L 351,360 L 351,422 L 330,408 L 319,384 L 313,374 L 293,375 Z"/>
        <path d="M 483,371 L 488,437 L 471,473 L 504,493 L 531,550 L 584,614 L 580,507 L 561,467 L 561,435 L 540,432 L 534,411 L 520,391 L 505,385 L 494,373 Z"/>
        <path d="M 638,374 L 635,421 L 606,440 L 585,466 L 641,457 L 697,489 L 755,501 L 855,546 L 855,523 L 756,477 L 728,459 L 704,445 L 686,424 L 667,411 L 657,398 L 646,377 Z"/>
      </g>
      <g id="ridge-highlights" fill="#f6ebd4">
        <path d="M 293,440 L 327,453 L 333,447 L 345,466 L 373,473 L 371,481 L 337,474 L 328,461 L 292,449 Z"/>
        <path d="M 439,466 L 466,462 L 474,470 L 495,466 L 489,476 L 470,480 L 463,472 L 439,475 Z"/>
        <path d="M 583,456 L 601,449 L 603,441 L 616,442 L 620,449 L 603,448 L 600,457 L 583,463 Z"/>
      </g>
      <g id="foreground" fill="#173f31">
        <path d="M 180,683 Q 335,630 500,689 Q 661,638 820,680 L 820,850 L 180,850 Z"/>
        <use xlink:href="#pine" transform="translate(294 651) scale(.82)"/>
        <use xlink:href="#pine" transform="translate(500 657)"/>
        <use xlink:href="#pine" transform="translate(708 650) scale(.82)"/>
      </g>
    </g>
    <circle cx="500" cy="505" r="313" fill="none" stroke="#f6ebd4" stroke-width="10"/>
  </g>
  <!-- Three passes form the green edge, cream border, and bubble-letter ink. -->
  <g id="lettering" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#summit" stroke="#173f31" stroke-width="66"/>
    <use xlink:href="#scene" stroke="#173f31" stroke-width="66"/>
    <use xlink:href="#summit" stroke="#f6ebd4" stroke-width="56"/>
    <use xlink:href="#scene" stroke="#f6ebd4" stroke-width="56"/>
    <use xlink:href="#summit" stroke="#173f31" stroke-width="36"/>
    <use xlink:href="#scene" stroke="#173f31" stroke-width="36"/>
  </g>
</svg>
