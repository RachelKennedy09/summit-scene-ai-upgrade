<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Email | Summit Scene</title>
    <link rel="icon" href="./assets/app-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="legal-body">
    <header class="site-header legal-header">
      <a class="brand" href="./index.html#top" aria-label="Summit Scene home">
        <img src="./assets/logo-app-earth-transparent-alpha.png" alt="Summit Scene" class="brand-logo" />
        <span>Summit Scene</span>
      </a>
    </header>

    <main id="top" class="legal-main">
      <p class="eyebrow">Account</p>
      <h1>Verify your email</h1>
      <p id="status-message">
        Checking your verification link...
      </p>
      <p id="status-detail">
        Keep this page open for a moment.
      </p>
      <noscript>
        JavaScript is required to verify your email from this link. Open Summit
        Scene, go to Account, tap Enter verification token, and paste the token
        from this URL.
      </noscript>
    </main>

    <script>
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const statusMessage = document.getElementById("status-message");
      const statusDetail = document.getElementById("status-detail");

      function getApiBaseUrl() {
        if (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        ) {
          return "http://localhost:4000";
        }

        return "https://summit-scene-backend.onrender.com";
      }

      async function verifyEmail() {
        if (!token) {
          statusMessage.textContent = "No verification token found.";
          statusDetail.textContent =
            "Open the latest verification email and use the full link.";
          return;
        }

        try {
          const response = await fetch(`${getApiBaseUrl()}/api/auth/verify-email`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ token }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.message ||
                "This verification link is invalid or expired."
            );
          }

          statusMessage.textContent = "Email verified.";
          statusDetail.textContent =
            "Your Summit Scene account email is verified. You can return to the app and log in.";
        } catch (error) {
          statusMessage.textContent = "Could not verify this email.";
          statusDetail.textContent =
            error.message ||
            "The link may be expired. Open Summit Scene and request a new verification email.";
        }
      }

      verifyEmail();
    </script>
  </body>
</html>
