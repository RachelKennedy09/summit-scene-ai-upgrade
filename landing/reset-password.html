<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password | Summit Scene</title>
    <link rel="icon" href="./assets/app-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="legal-body">
    <header class="site-header legal-header">
      <a class="brand" href="./index.html#top" aria-label="Summit Scene home">
        <img src="./assets/logo-app-earth-transparent-alpha.png" alt="Summit Scene" class="brand-logo" />
        <span>Summit Scene</span>
      </a>
    </header>

    <main id="top" class="legal-main">
      <p class="eyebrow">Account</p>
      <h1>Reset your password</h1>
      <p>
        Open Summit Scene to choose a new password. If the app does not open,
        use the token below on the reset password screen.
      </p>
      <p>
        <a id="open-app-link" class="button primary" href="#">Open Summit Scene</a>
      </p>
      <pre id="token" style="white-space: pre-wrap; word-break: break-word;">Loading token...</pre>
    </main>

    <script>
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const appLink = token
        ? `summitscene://reset-password?token=${encodeURIComponent(token)}`
        : "summitscene://reset-password";
      const openAppLink = document.getElementById("open-app-link");

      openAppLink.href = appLink;
      document.getElementById("token").textContent = token || "No token found in this link.";

      if (token) {
        window.setTimeout(() => {
          window.location.href = appLink;
        }, 250);
      }
    </script>
  </body>
</html>
