[build]
  publish = ".website-dist"
  command = "npm run build:website"

[build.environment]
  # Public Apple Developer Team ID supplied by the app owner.
  APPLE_TEAM_ID = "8KSNLDY8AS"
  # Public Android signing certificate supplied by the app owner.
  ANDROID_SHA256_CERT_FINGERPRINTS = "55:EE:AA:6B:CF:1E:5A:FE:46:2B:68:8A:B0:1C:5D:ED:7E:CD:2B:CA:2E:F9:9C:C4:D3:96:1C:93:78:06:B3:DC"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/verify-email*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reset-password*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/verify-email"
  to = "/verify-email.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200

[[redirects]]
  from = "/verify-email-change"
  to = "/verify-email-change.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
